[workspace]
resolver = "3"
members = ["crates/tr-core", "crates/tr-content", "crates/tr-render", "crates/tr-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
glam = "0.30"
pollster = "0.4"
wgpu = "30"
winit = "0.30"
egui = "0.37"
egui-wgpu = "0.37"
egui-winit = "0.37"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
font8x8 = "0.3"
rayon = "1"
rodio = "0.20"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
