[package]
name = "tr-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "terraria-rust"
path = "src/main.rs"

[features]
default = []
# The F3 developer workbench (`src/debug_panel.rs` + the `tr-debug` crate).
# OFF by default: `cargo build --release` excludes the module, its `App` field
# and every call site. Dev builds: `cargo run --features debug`.
debug = ["dep:tr-debug"]

[dependencies]
tr-content = { path = "../tr-content" }
tr-core = { path = "../tr-core" }
tr-render = { path = "../tr-render" }
tr-debug = { path = "../tr-debug", optional = true }

aes.workspace = true
anyhow.workspace = true
arboard.workspace = true
bytemuck.workspace = true
env_logger.workspace = true
flate2.workspace = true
glam.workspace = true
image.workspace = true
log.workspace = true
pollster.workspace = true
rayon.workspace = true
rodio.workspace = true
serde_json.workspace = true
wgpu.workspace = true
winit.workspace = true

[build-dependencies]
tr-content = { path = "../tr-content" }
image.workspace = true
